<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LoL Overlay</title>
    <link rel="stylesheet" href="../css/LoLOverlay.css">
    <link rel="stylesheet" href="../css/individual/LoL_Overlay_Portrait.css">
</head>
<body>
    <div id="overlay-canvas" class="live-client-data-unavailable">
        <div id="goldChart"></div>
        <div class="scoreboard-widget">
            <div class="scoreboard-scale-frame">
                <div id="ScoreBord"></div>
            </div>
        </div>
        <div class="role-gold-diff-widget">
            <div id="RoleGoldDiff"></div>
        </div>
        <div id="active-player-cs" class="active-player-cs" hidden></div>
    </div>

        <script src="../js/LoL_Api.js"></script>
        <script src="../js/LoL_GoldChart.js"></script>
        <script src="../js/LoL_ScoreBord.js"></script>
        <script src="../js/LoL_TopBar.js"></script>
        <script src="../js/LoL_ObjectTimer.js"></script>
        <script src="../js/LoL_SkillLevelUp.js"></script>
    <script>
        async function initializeOverlay() {
            await initializeCommon();
            await refreshPlayerDict();
            setInterval(refreshPlayerDict, 1000);
        }

        initializeOverlay();
    </script>
</body>
</html>
