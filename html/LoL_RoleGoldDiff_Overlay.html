<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LoL Role Gold Difference Overlay</title>
    <link rel="stylesheet" href="../css/LoLOverlay.css">
    <link rel="stylesheet" href="../css/individual/LoL_RoleGoldDiff_Overlay.css">
</head>
<body>
    <div id="overlay-canvas" class="live-client-data-unavailable">
        <div class="role-gold-diff-widget">
            <div id="RoleGoldDiff"></div>
        </div>
    </div>

    <script src="../js/LoL_Api.js"></script>
    <script src="../js/LoL_RoleGoldDiff.js"></script>
    <script>
        async function initializeRoleGoldDiffOverlay() {
            await initializeCommon();
            await refreshPlayerDict();
            setInterval(refreshPlayerDict, 1000);
        }

        initializeRoleGoldDiffOverlay();
    </script>
</body>
