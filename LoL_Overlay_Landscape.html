<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LoL Overlay</title>
    <link rel="stylesheet" href="css/LoL_Overlay.css">
    <style>
        :root {
            /* 各ウィジェットの表示位置はここでまとめて調整する。 */
            --canvas-width: 1920px;
            --canvas-height: 1080px;
            --topbar-top: 0px;
            --topbar-left: 50%;
            --topbar-transform: translateX(-50%);
            --topbar-scale: 1;

            --gold-chart-left: 0px;
            --gold-chart-bottom: 230px;
            --gold-chart-scale: 1.3;
            --scoreboard-left: 0px;
            --scoreboard-bottom: 0px;
            --scoreboard-width: 720px;
            --scoreboard-display-width: 504px;
            --scoreboard-display-height: 180px;
            --scoreboard-scale: 0.9;

            --role-gold-diff-top: 100px;
            --role-gold-diff-right: 24px;
            --role-gold-diff-width: 240px;
            --role-gold-diff-scale: 1;
            --active-player-cs-top: 258px;
            --object-timer-top: 10px;
            --object-timer-right: 10px;
            --object-timer-scale: 1.0;
        }
    </style>
</head>
<body>
    <div id="overlay-canvas" class="live-client-data-unavailable">
        <div id="goldChart"></div>
        <div class="scoreboard-widget">
            <div class="scoreboard-scale-frame">
                <div id="ScoreBord"></div>
            </div>
        </div>
    </div>

        <script src="js/LoL_Api.js"></script>
        <script src="js/LoL_GoldChart.js"></script>
        <script src="js/LoL_ScoreBord.js"></script>
        <script src="js/LoL_TopBar.js"></script>
        <script src="js/LoL_ObjectTimer.js"></script>
        <script>
            async function initializeOverlay() {
                await initializeCommon();
                await refreshPlayerDict();
                setInterval(refreshPlayerDict, 1000);
            }

            initializeOverlay();
        </script>
</body>
</html>
