# This is an example configuration file
# To learn more, see the full config.yaml reference: https://docs.continue.dev/reference

name: Example Config
version: 1.0.0
schema: v1

# Define which models can be used
# https://docs.continue.dev/customization/models
models:
  - name: my gpt-5
    provider: openai
    model: gpt-5
    apiKey: YOUR_OPENAI_API_KEY_HERE
  - name: qwen2.5-coder 7b
    provider: ollama
    model: qwen2.5-coder:7b
    roles:
      - apply
      - autocomplete
      - chat
      - edit
  - name: Claude 4 Sonnet
    provider: anthropic
    model: claude-sonnet-4-20250514
    apiKey: ${{ secrets.ANTHROPIC_API_KEY }}
    roles:
      - chat
      - edit
      - apply
    defaultCompletionOptions:
      contextLength: 200000
      maxTokens: 64000
    capabilities:
      - tool_use
      - image_input

module: auth
responsibilities:
- ユーザー認証
- JWT発行
public_apis:
- LoginService.login
- LoginService.logout
dependencies:
- Logger
- ConfigManager
repeated_patterns:
- 入力検証
- エラーハンドリング
- ログ出力
candidate_abstractions:
- Validator
- AuthContext
technical_debt:
- LoginServiceが肥大化
summary: >
認証処理を担当するモジュール。
現状ではauthモジュールのコードが特定できませんでした。

