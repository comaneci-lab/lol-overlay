<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LoL Skill Level-Up Overlay</title>
    <link rel="stylesheet" href="css/LoL_Overlay.css">
    <style>
        :root {
            --skill-level-up-icon-scale: 2.0;
        }

        html,
        body {
            width: 100%;
            height: max-content;
            overflow: visible;
        }

        #overlay-canvas {
            display: flex;
            justify-content: center;
            width: 100%;
            height: max-content;
            overflow: visible;
        }

        .skill-level-up-widget {
            position: static;
            justify-content: center;
            width: 100%;
            transform: none;
        }
    </style>
</head>
<body>
    <div id="overlay-canvas"></div>

    <script src="js/LoL_SkillLevelUp.js"></script>
</body>
</html>
